version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - medorica_mr_backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    env_file:
      - .env
    environment:
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "False"
      PGADMIN_CONFIG_WTF_CSRF_CHECK_DEFAULT: "False"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
    ports:
      - "2001:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medorica_mr_backend_net

  migrate:
    build: .
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - medorica_mr_backend_net

  backend:
    build: .
    env_file:
      - .env
    ports:
      - "2000:2000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - medorica_mr_backend_net

volumes:
  db_data:

networks:
  medorica_mr_backend_net:
    driver: bridge
